# Backend → Docker Hub, cu verificările de securitate după imagine.
#
#   build      restore, build, teste (fostul build.yml) + NuGet audit pe pachetele vulnerabile
#   image      imaginea se construiește și urcă în Docker Hub ca `sha-<commit>`, apoi Trivy o scanează
#   după imagine, în paralel:
#     semgrep  SAST                                  — blochează pe severitate ERROR
#     codeql   SAST (Security → Code scanning)
#     gitleaks secrete în tot istoricul              — blochează pe orice găsire
#     sca      Trivy pe Directory.Packages.props     — blochează pe CRITICAL cu fix disponibil
#     iac      Trivy config + Hadolint pe Dockerfile — doar raport
#   release    doar pe main: `sha-<commit>` devine `latest` și se semnează cu cosign (keyless)
#
# DAST lipsește aici: API-ul nu pornește fără Postgres și cheile Stripe/ANAF. Se poate adăuga cu un
# Postgres ca service container, când merită.
#
# De setat în Settings → Secrets and variables → Actions:
#   secrets.DOCKERHUB_USERNAME   utilizatorul Docker Hub
#   secrets.DOCKERHUB_TOKEN      Personal Access Token Docker Hub, Read & Write
#   vars.DOCKERHUB_NAMESPACE     utilizatorul sau organizația sub care stă `ridelance-backend`

name: DevSecOps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Luni dimineața: imaginea se reconstruiește pe imaginile de bază la zi și se rescanează,
    # pentru CVE-urile apărute de la ultimul push.
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/ridelance-backend
  # Pe PR nu se urcă nimic (un PR dintr-un fork n-are acces la secrete): imaginea rămâne locală.
  PUSH: ${{ github.event_name != 'pull_request' }}
  TRIVY: aquasec/trivy:0.74.0
  SEMGREP: semgrep/semgrep:1.178.0
  GITLEAKS: zricethezav/gitleaks:v8.30.1
  HADOLINT: hadolint/hadolint:v2.15.1

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    env:
      DOTNET_VERSION: "10.x"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # OpenCV, folosit la plăcuțele de înmatriculare și la curățarea pozelor din dosare, vine ca
      # bibliotecă nativă. `libOpenCvSharpExtern.so` cere la încărcare libjpeg 8, libpng16,
      # libopenjp2 7, libtiff 5 și OpenEXR 2.5 — citite din antetul ELF al fișierului, nu ghicite.
      #
      # Noble are libtiff 6, nu 5, și n-are deloc OpenEXR 2.5. Amândouă se rezolvă exact ca în
      # Dockerfile: o legătură simbolică pentru libtiff și bibliotecile OpenEXR luate dintr-un
      # container jammy. Fără ele, testele pe imagini se raportează sărite, cu motivul la vedere.
      - name: OpenCV native deps
        # Pregătire de mediu, nu cod: dacă pică (pachet redenumit, jammy indisponibil), testele pe
        # imagini se sar singure, iar restul suitei merge mai departe. Pasul rămâne marcat roșu, ca
        # să se vadă că mediul are o problemă.
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libjpeg-turbo8 libpng16-16t64 libtiff6 libopenjp2-7
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtiff.so.6 /usr/lib/x86_64-linux-gnu/libtiff.so.5
          mkdir -p /tmp/openexr
          docker run --rm -v /tmp/openexr:/out ubuntu:22.04 bash -c "\
            apt-get update -qq && apt-get install -y --no-install-recommends libopenexr25 && \
            cp -a /usr/lib/x86_64-linux-gnu/libIlm*.so.25* \
                  /usr/lib/x86_64-linux-gnu/libIex*.so.25* \
                  /usr/lib/x86_64-linux-gnu/libImath*.so.25* \
                  /usr/lib/x86_64-linux-gnu/libHalf*.so.25* /out/"
          sudo cp -a /tmp/openexr/. /usr/lib/x86_64-linux-gnu/
          sudo ldconfig

      - name: Restore
        run: dotnet restore CleanArchitecture.slnx

      - name: Build
        run: dotnet build CleanArchitecture.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CleanArchitecture.slnx --configuration Release --no-restore --no-build

      - name: NuGet audit
        # Avertismentele NuGet (GitHub Advisory), inclusiv pachetele tranzitive. Doar raport:
        # poarta pe dependențe e Trivy, în jobul `sca`, ca la celelalte proiecte.
        run: dotnet list CleanArchitecture.slnx package --vulnerable --include-transitive

  image:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      tag: ${{ steps.ref.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image reference
        id: ref
        run: |
          if [ "$PUSH" = "true" ] && [ -z "${{ vars.DOCKERHUB_NAMESPACE }}" ]; then
            echo "::error::vars.DOCKERHUB_NAMESPACE nu e setat (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
          if [ "$PUSH" = "true" ]; then
            echo "tag=$IMAGE:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=ridelance-backend:pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUSH == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          tags: ${{ steps.ref.outputs.tag }}
          # SBOM și provenance ca atestări pe imagine, în Docker Hub. Pe `load` nu se pot atașa.
          sbom: ${{ env.PUSH == 'true' }}
          provenance: ${{ env.PUSH == 'true' && 'mode=max' || 'false' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        env:
          TRIVY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
          REF: ${{ env.PUSH == 'true' && format('{0}@{1}', env.IMAGE, steps.push.outputs.digest) || steps.ref.outputs.tag }}
        run: |
          trivy() {
            docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" -v "$PWD:/work" -w /work "$TRIVY" "$@"
          }
          trivy image --scanners vuln --format sarif --output trivy-image.sarif "$REF"
          trivy image --scanners vuln --format cyclonedx --output sbom.cdx.json "$REF"
          trivy image --scanners vuln --severity HIGH,CRITICAL --format table "$REF"
          # Poarta: CRITICAL cu fix disponibil. HIGH rămâne în raport.
          trivy image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --format table "$REF"

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('trivy-image.sarif') != ''
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: image-scan
          path: |
            trivy-image.sarif
            sbom.cdx.json
          if-no-files-found: ignore

  semgrep:
    name: SAST (Semgrep)
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP" semgrep scan \
            --config p/default --config p/owasp-top-ten --config p/csharp \
            --config p/dockerfile \
            --metrics off --sarif --output semgrep.sarif
          errors=$(jq '[.runs[].results[] | select(.level == "error")] | length' semgrep.sarif)
          echo "Semgrep: $errors găsiri cu severitate ERROR"
          [ "$errors" -eq 0 ]

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  codeql:
    name: SAST (CodeQL)
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: codeql-${{ matrix.language }}

  gitleaks:
    name: Secrets (Gitleaks)
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        # Același uid ca proprietarul checkout-ului, altfel git refuză repo-ul („dubious ownership").
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" "$GITLEAKS" \
            git /repo --redact --report-format sarif --report-path /repo/gitleaks.sarif --exit-code 1

      - name: Normalize Gitleaks SARIF regions
        if: always() && hashFiles('gitleaks.sarif') != ''
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('gitleaks.sarif')
          report = json.loads(path.read_text(encoding='utf-8'))
          corrected = 0

          def normalize(value):
              global corrected
              if isinstance(value, dict):
                  for key, region in value.items():
                      if key in ('region', 'contextRegion') and isinstance(region, dict):
                          if any(column in region and region[column] < 1
                                 for column in ('startColumn', 'endColumn')):
                              # Columns are optional in SARIF. Keep the original line
                              # location rather than inventing a column for the finding.
                              region.pop('startColumn', None)
                              region.pop('endColumn', None)
                              corrected += 1
                      normalize(region)
              elif isinstance(value, list):
                  for item in value:
                      normalize(item)

          normalize(report)
          path.write_text(json.dumps(report, ensure_ascii=False), encoding='utf-8')
          print(f'Normalized {corrected} SARIF regions; all findings preserved.')
          PY

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('gitleaks.sarif') != ''
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  sca:
    name: Dependencies (Trivy)
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy filesystem scan
        run: |
          trivy() { docker run --rm -v "$HOME/.cache/trivy:/root/.cache/trivy" -v "$PWD:/work" -w /work "$TRIVY" "$@"; }
          trivy fs --scanners vuln --format sarif --output trivy-fs.sarif .
          trivy fs --scanners vuln --severity HIGH,CRITICAL --format table .
          trivy fs --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --format table .

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('trivy-fs.sarif') != ''
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  iac:
    name: Dockerfile (Trivy config, Hadolint)
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy config
        run: |
          docker run --rm -v "$HOME/.cache/trivy:/root/.cache/trivy" -v "$PWD:/work" -w /work "$TRIVY" \
            config --format sarif --output trivy-config.sarif .
          docker run --rm -v "$HOME/.cache/trivy:/root/.cache/trivy" -v "$PWD:/work" -w /work "$TRIVY" \
            config --severity HIGH,CRITICAL .

      - name: Hadolint
        run: |
          docker run --rm -i "$HADOLINT" hadolint --no-fail -f sarif - < Dockerfile > hadolint.sarif
          docker run --rm -i "$HADOLINT" hadolint --no-fail - < Dockerfile

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('trivy-config.sarif') != ''
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && hashFiles('hadolint.sarif') != ''
        with:
          sarif_file: hadolint.sarif
          category: hadolint

  release:
    name: Release (latest + cosign)
    needs: [image, semgrep, codeql, gitleaks, sca]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # semnătura keyless: identitatea vine din OIDC-ul GitHub, fără cheie de ținut
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Tag latest
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@${{ needs.image.outputs.digest }}"

      - name: Sign
        run: cosign sign --yes "$IMAGE@${{ needs.image.outputs.digest }}"
